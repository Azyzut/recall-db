{{- $nonEmpty := dict }}
{{- range $k, $v := .Values.secretEnv }}{{ if $v }}{{ $_ := set $nonEmpty $k $v }}{{ end }}{{ end }}
{{- if and (not .Values.existingSecret) $nonEmpty }}
# Hook-annotated so it exists before the migration Job that references it.
# hook-weight -20 puts it ahead of the Job at -10.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  labels:
    app: {{ .Chart.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
{{- range $k, $v := $nonEmpty }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
